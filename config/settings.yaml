project:
  name: "dl-stock-risk-prediction"
  tickers: ["RELIANCE.NS", "TCS.NS"]

data:
  start_date: "2015-01-01"
  end_date: "2024-01-01"
  frequency: "1d"

targets:
  direction_shift: 1
  downside_risk_threshold: -0.02

features:
  sequence_length: 30 # For sequential models like LSTM
  groups:
    raw: true
    trend: true
    momentum: true
    volatility: true
    volume: true
    market_context: true
  market_assets: ["^NSEI", "^INDIAVIX"]

models:
  baseline:
    type: "xgboost"
  deep_learning:
    type: "mlp"
    layers: [32, 16]
    dropout: 0.2
    use_batch_norm: false
    epochs: 60
    batch_size: 64
    learning_rate: 0.001
    weight_decay: 0.001

training:
  # Fixed chronological boundaries (inclusive). Frozen to match run 20261007_003042 so the
  # test period stays 2024-12-23 .. 2026-09-10 regardless of how many rows the data has.
  split_dates:
    train_end: "2023-10-19"
    val_end: "2024-12-20"
    test_end: "2026-09-10"

backtesting:
  initial_capital: 100000
  # Charged per side: on every entry and every exit (a round trip pays twice = 0.30%)
  transaction_cost: 0.001   # 0.10%
  slippage: 0.0005          # 0.05%  -> 0.15% per side in total
  # Assumption: approximate RBI 91-day Treasury-bill yield over the test period
  # (Dec 2024 - Sep 2026; auction cut-offs roughly 5.5%-6.7%). Constant, annual.
  risk_free_rate_annual: 0.06
